name: Daily Scraper

on:
  schedule:
    # 2:00 AM IST = 8:30 PM UTC (previous day)
    # Using 20:30 UTC to match 2:00 AM IST
    - cron: '30 20 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      company:
        description: 'Scrape a specific company (leave empty for all)'
        required: false
        default: ''
      scrape_only:
        description: 'Only scrape, skip pipeline sync'
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render scraper webhook (all companies)
        if: ${{ github.event.inputs.company == '' || github.event.inputs.company == null }}
        run: |
          echo "🚀 Triggering Render scraper webhook..."

          RESPONSE=$(curl -s -X POST \
            https://jobcompare-scraper.onrender.com/trigger-scrape \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${{ secrets.SCRAPE_WEBHOOK_TOKEN }}\"}" \
            -w "\n%{http_code}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Scraper triggered successfully"
          else
            echo "❌ Failed to trigger scraper"
            exit 1
          fi

      - name: Trigger Render scraper webhook (single company)
        if: ${{ github.event.inputs.company != '' && github.event.inputs.company != null }}
        run: |
          echo "⚠ Single company scraping not supported via webhook"
          echo "Please use manual trigger on Render dashboard or GitHub Actions UI"
          exit 0

      - name: Log webhook trigger
        if: always()
        run: |
          echo "## Scraper Webhook Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The scraper is running on **Render** (not GitHub Actions)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Monitor progress:" >> $GITHUB_STEP_SUMMARY
          echo "- Check Render logs: https://dashboard.render.com" >> $GITHUB_STEP_SUMMARY
          echo "- View scraped data: https://github.com/karthikaiz/JobCompare/tree/main/scraper/data/scraped" >> $GITHUB_STEP_SUMMARY
