name: Daily Scraper

on:
  schedule:
    # 2:00 AM IST = 8:30 PM UTC (previous day)
    - cron: '30 20 * * *'

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger scraper on Render
        run: |
          response=$(curl -s -o response.json -w "%{http_code}" -X POST \
            https://jobcompare-scraper.onrender.com/trigger-scrape \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${{ secrets.SCRAPE_WEBHOOK_TOKEN }}\"}")

          echo "HTTP status: $response"
          cat response.json

          if [ "$response" != "200" ]; then
            echo "Webhook failed with status $response"
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Scraper Webhook Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The scraper is running on **Render** (not GitHub Actions)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 Monitor progress:" >> $GITHUB_STEP_SUMMARY
          echo "- Check Render logs: https://dashboard.render.com" >> $GITHUB_STEP_SUMMARY
